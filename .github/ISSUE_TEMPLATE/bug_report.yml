name: Bug report
description: Something in antiflow doesn't behave as documented.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. **Security problems** (for example, a secret reaching
        storage, events or logs) should be reported privately instead: see
        [SECURITY.md](https://github.com/shaheersystems-inc/antiflow/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, including any error message, run or node status, or events.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      description: Link the docs page that describes the expected behaviour, if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: |
        The smallest workflow definition and node types that show the problem, and how you
        call `execute()`. Fake node types are fine.
      render: ts
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: antiflow version
      placeholder: 0.1.0-beta.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Runtime and version
      placeholder: Node 22.11, Bun 1.3, Deno 2.1, …
    validations:
      required: true
  - type: input
    id: storage
    attributes:
      label: Storage adapter
      description: The in-memory adapter, or which custom adapter you use.
      placeholder: in-memory
